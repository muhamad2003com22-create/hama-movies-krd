<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Movies — فیلمەکانم</title>
  <meta name="description" content="فیلمەکانی سەیرکراو — My personal movie collection tracker" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- Firebase SDK -->
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="container" id="app">
    <header class="dashboard-header">
      <div class="header-content">
        <h1>
          <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="17" y1="7" x2="22" y2="7"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="2" y1="17" x2="7" y2="17"></line></svg>
          My Movies
        </h1>
        <p>ئەو فیلمانەی کە سەیرم کردوون</p>
        <div class="movie-count-badge" id="movie-count" style="display:none;">
          <span id="count-number">0</span> فیلم پۆست کراوە
        </div>
      </div>
      <div class="header-actions">
        <a href="add.html" class="btn-primary" id="add-movie-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          زیادکردنی فیلم
        </a>
        <button class="btn-secondary" id="logout-btn">
          دەرچوون
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </header>

    <div id="filter-section" class="filter-section animate-fade-in" style="display:none;"></div>

    <div class="movies-grid" id="movies-grid">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>چاوەڕوان بە...</p>
      </div>
    </div>
  </main>

  <!-- Delete Confirm Modal -->
  <div class="modal-overlay" id="delete-modal" style="display:none;">
    <div class="modal glass-panel animate-fade-in">
      <h3>دڵنیایت؟</h3>
      <p>ئایا دڵنیایت لە سڕینەوەی ئەم فیلمە؟</p>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancel-delete">نەخێر</button>
        <button class="btn-danger" id="confirm-delete">سڕینەوە</button>
      </div>
    </div>
  </div>
</body>
</html>
