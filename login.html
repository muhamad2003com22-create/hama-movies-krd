<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>چوونەژوورەوە — My Movies</title>
  <meta name="description" content="چوونەژوورەوە بۆ بینینی فیلمەکانت" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="login-wrapper">
    <div class="glass-panel login-card animate-fade-in">
      <div class="login-header">
        <h1>
          <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          My Movies
        </h1>
        <p>تکایە پاسۆردەکەت بنووسە بۆ چوونە ژوورەوە</p>
      </div>

      <form class="login-form" id="login-form">
        <div class="input-group">
          <label class="input-label" for="password">پاسۆرد (Password)</label>
          <input
            type="password"
            id="password"
            name="password"
            class="input-field"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
        </div>

        <div id="login-error" class="error-message" style="display:none;"></div>

        <button type="submit" class="btn-primary" id="login-btn">
          چوونە ژوورەوە
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
        </button>
      </form>
    </div>
  </div>
</body>
</html>
